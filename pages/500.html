<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Something Went Wrong | BYU-I Find</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/error.css">

  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="../js/error.js" defer></script>
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body class="error-page">

  <main class="error-container">

    <div class="error-icon">
      <i data-lucide="cloud-off"></i>
    </div>

    <p class="error-code">500</p>

    <h1>Something didn't work as expected.</h1>

    <p class="error-description">
      We're having trouble loading this page right now.
      Please try again in a moment.
    </p>

    <div class="error-actions">
      <a href="../index.html" class="error-button">
        <i data-lucide="house"></i>
        Back to Home
      </a>

      <button
        type="button"
        class="error-secondary"
        id="retry-button"
      >
        Try Again
      </button>
    </div>

  </main>

</body>
</html>
