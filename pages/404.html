<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | BYU-I Find</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/error.css">

  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="../js/error.js" defer></script>
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body class="error-page">

  <main class="error-container">

    <div class="error-icon">
      <i data-lucide="search-x"></i>
    </div>

    <p class="error-code">404</p>

    <h1>Looks like this page got lost.</h1>

    <p class="error-description">
      We couldn't find the page you're looking for.
      It might have moved, or the link might be incorrect.
    </p>

    <div class="error-actions">
      <a href="../index.html" class="error-button">
        <i data-lucide="house"></i>
        Back to Home
      </a>

      <a href="feedback.html" class="error-secondary">
        Report a broken link
      </a>
    </div>

  </main>

</body>
</html>
